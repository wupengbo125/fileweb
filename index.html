<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fileweb</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="fileweb">
<style>
  :root {
    --primary: #0066cc; --ink: #1d1d1f; --muted: #7a7a7a;
    --canvas: #ffffff; --parchment: #f5f5f7; --hairline: #e0e0e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--parchment); color: var(--ink);
    font-family: system-ui, -apple-system, "SF Pro Text", sans-serif;
    font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; }

  /* ---- 导航栏（frosted） ---- */
  .nav { position: sticky; top: 0; z-index: 10;
    background: rgba(245,245,247,.8); -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    display: flex; align-items: center; height: 52px;
    padding: calc(env(safe-area-inset-top) + 0px) 16px 0; border-bottom: 1px solid var(--hairline); }
  .nav .navbtn { width: 44px; height: 44px; margin: 0 -8px; background: none; border: 0; padding: 0;
    color: var(--primary); display: flex; align-items: center; justify-content: center; }
  .nav .navbtn:active:not(:disabled) { opacity: .4; }
  .nav .navbtn:disabled { color: #c7c7cc; }
  .nav .title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }

  /* ---- 大标题 ---- */
  h1 { font-family: system-ui, -apple-system, "SF Pro Display", sans-serif;
    font-size: 34px; font-weight: 600; letter-spacing: -0.374px;
    margin: 24px 16px 12px; }

  /* ---- 分组列表 ---- */
  .group { background: var(--canvas); border: 1px solid rgba(0,0,0,.08); border-radius: 18px;
    margin: 0 16px 24px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px;
    font-size: 17px; cursor: pointer; }
  .row:active { background: rgba(0,102,204,.06); }
  .row + .row { border-top: 1px solid rgba(0,0,0,.06); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 14px; letter-spacing: -0.224px; color: var(--muted); flex: none; }
  .row svg { flex: none; }
  .chev { color: #c7c7cc; flex: none; }
  .empty { margin: 0 16px; color: var(--muted); font-size: 15px; text-align: center; padding: 32px 0; }

  /* ---- 编辑器 ---- */
  #editor { position: fixed; inset: 0; background: var(--canvas); display: none; flex-direction: column; z-index: 20; }
  #editor .nav { background: rgba(255,255,255,.85); }
  #editor .close { color: var(--primary); font-size: 17px; background: none; border: 0; padding: 12px 0; }
  #editor .close:active { opacity: .4; }
  #editor .save { background: var(--primary); color: #fff; border: 0; border-radius: 9999px;
    font-size: 17px; padding: 8px 20px; }
  #editor .save:active { transform: scale(0.95); }
  #editor .save:focus { outline: 2px solid #0071e3; outline-offset: 2px; }
  #filename { position: fixed; top: calc(env(safe-area-inset-top) + 40px); left: 0; right: 0;
    text-align: center; font-size: 12px; letter-spacing: -0.12px; color: var(--muted); z-index: 21; pointer-events: none; }
  #edbody { flex: 1; display: flex; min-height: 0; background: var(--canvas); }
  #gutter { flex: none; width: 44px; overflow: hidden; background: var(--parchment);
    border-right: 1px solid var(--hairline); }
  #gutter pre { margin: 0; padding: 44px 8px 16px 0; text-align: right; color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; line-height: 1.6; }
  textarea { flex: 1; width: 100%; border: 0; padding: 44px 16px 16px 8px; background: var(--canvas); color: var(--ink);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; line-height: 1.6;
    letter-spacing: 0; white-space: pre; overflow: auto; resize: none; }
  textarea:focus { outline: none; }

  /* ---- 上传悬浮按钮 ---- */
  .fab { position: fixed; right: 21px; bottom: calc(env(safe-area-inset-bottom) - 10px);
    width: 56px; height: 56px; border-radius: 9999px; border: 0; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center; z-index: 15; }
  .fab:active { transform: scale(.95); }
  .fab:disabled { opacity: .5; }

  /* ---- 加号菜单 ---- */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 14; }
  .menu { position: fixed; right: 20px; bottom: calc(env(safe-area-inset-bottom) + 92px);
    width: 190px; background: rgba(255,255,255,.96);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); overflow: hidden; z-index: 16; }
  .menu button { display: block; width: 100%; text-align: left; font: inherit; font-size: 17px;
    letter-spacing: -0.374px; color: var(--ink); padding: 13px 16px; background: none; border: 0; }
  .menu button:active { background: rgba(0,102,204,.08); }
  .menu button + button { border-top: 1px solid rgba(0,0,0,.06); }

  /* ---- toast ---- */
  #toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(8px); bottom: 48px;
    background: rgba(29,29,31,.9); color: #fff; font-size: 14px; letter-spacing: -0.224px;
    padding: 10px 22px; border-radius: 9999px; opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; z-index: 30; }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- 成功对勾 / 失败弹窗 ---- */
  #okfl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    z-index: 40; pointer-events: none; }
  #okfl.on { display: flex; }
  #okfl .tick { width: 96px; height: 96px; border-radius: 26px; background: rgba(52,199,89,.95);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  #dlg, #dlgmask { position: fixed; }
  #dlg[hidden], #dlgmask[hidden] { display: none; }
  #dlgmask { inset: 0; background: rgba(0,0,0,.28); z-index: 41; }
  #dlg { left: 50%; top: 50%; transform: translate(-50%,-50%); width: 86%; max-width: 420px; max-height: 76vh;
    display: flex; flex-direction: column; background: #fff; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; z-index: 42; }
  #dlg h2 { margin: 0; padding: 20px 20px 6px; font-size: 17px; font-weight: 600; color: #ff3b30; }
  #dlgmsg { margin: 0; padding: 0 20px; font-size: 15px; line-height: 1.5; }
  #dlglog { margin: 14px 20px; padding: 12px; background: var(--parchment); border-radius: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; overflow: auto; min-height: 0; }
  #dlg button { flex: none; margin: 0 20px 20px; padding: 11px 22px; font: inherit; font-size: 17px;
    border: 0; border-radius: 9999px; background: var(--primary); color: #fff; }
  #dlg button:active { transform: scale(.95); }

  .safe-bottom { height: env(safe-area-inset-bottom); }
</style>
</head>
<body>

<div class="nav" id="listnav">
  <button class="navbtn" id="back" aria-label="后退" disabled></button>
  <div class="title" id="title">fileweb</div>
  <button class="navbtn" id="refresh" aria-label="刷新"></button>
</div>
<h1 id="bigtitle">fileweb</h1>
<div class="group" id="group"></div>
<div class="empty" id="empty" hidden>此文件夹为空</div>
<button class="fab" id="fab" aria-label="更多">
  <svg width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
</button>
<input type="file" id="fileinp" hidden>
<div class="mask" id="mask" hidden></div>
<div class="menu" id="menu" hidden>
  <button id="miUpload">选择文件上传</button>
  <button id="miSync">同步 GitHub 仓库</button>
</div>
<div class="safe-bottom"></div>

<div id="editor">
  <div class="nav">
    <button class="close" onclick="closeEd()">关闭</button>
    <div class="title" style="visibility:hidden">·</div>
    <button class="save" onclick="save()">保存</button>
  </div>
  <div id="filename"></div>
  <div id="edbody">
    <div id="gutter"><pre id="ln"></pre></div>
    <textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </div>
</div>
<div id="toast"></div>
<div id="okfl"><div class="tick">
  <svg width="52" height="52" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round" d="M5 12.5 10 17.5 19 7"/></svg>
</div></div>
<div id="dlgmask" hidden></div>
<div id="dlg" hidden>
  <h2 id="dlgtitle">操作失败</h2>
  <p id="dlgmsg"></p>
  <pre id="dlglog" hidden></pre>
  <button onclick="closeDlg()">关闭</button>
</div>

<script>
const SVG_FOLDER = '<svg width="26" height="26" viewBox="0 0 24 24"><path fill="#4da3ff" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6a2 2 0 0 1 1.5.68L11.9 6h6.6A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11z"/></svg>';
const SVG_DOC = '<svg width="24" height="24" viewBox="0 0 24 24"><path fill="#98989d" opacity=".35" d="M6 3.5A1.5 1.5 0 0 1 7.5 2H14l4.5 4.5V20a1.5 1.5 0 0 1-1.5 1.5H7.5A1.5 1.5 0 0 1 6 20V3.5z"/><path fill="none" stroke="#98989d" stroke-width="1.4" d="M7 2.7h6.6L17.8 6.9V19.8a1.5 1.5 0 0 1-1.5 1.5H7.7a1.5 1.5 0 0 1-1.5-1.5V4.2A1.5 1.5 0 0 1 7 2.7z"/><path stroke="#98989d" stroke-width="1.2" stroke-linecap="round" fill="none" d="M9 12h6M9 15h6M9 9h3"/></svg>';
const SVG_CHEV = '<svg class="chev" width="8" height="14" viewBox="0 0 8 14"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M1.5 1.5 6.5 7l-5 5.5"/></svg>';

const SVG_CHEV_L = '<svg width="13" height="22" viewBox="0 0 13 22"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M11 2 2.5 11 11 20"/></svg>';
const SVG_REFRESH = '<svg width="22" height="22" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V8.5h-5"/></g></svg>';
document.getElementById("back").innerHTML = SVG_CHEV_L;
document.getElementById("refresh").innerHTML = SVG_REFRESH;

let cur = "", curFile = "", savedVal = "";
let hist = [""], hidx = 0;   // 后退栈：进新目录 push

function updateNav() {
  document.getElementById("back").disabled = hidx <= 0;
}

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401 || r.redirected) { location = "/login"; return {}; }
  return r.json();
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rel = (p, n) => p ? p + "/" + n : n;

async function render(p) {
  const d = await api("/api/list?path=" + encodeURIComponent(p));
  if (!d || d.error) { if (d && d.error) toast(d.error); return; }
  cur = p;
  const name = p ? p.split("/").pop() : "fileweb";
  document.getElementById("title").textContent = name;
  document.getElementById("bigtitle").textContent = name;
  const g = document.getElementById("group");
  g.innerHTML = "";
  const es = d.entries;
  document.getElementById("empty").hidden = es.length > 0;
  for (const e of es) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = (e.type === "dir" ? SVG_FOLDER : SVG_DOC) +
      `<span class="name">${esc(e.name)}</span>` +
      (e.type === "file" ? `<span class="meta">${e.mtime}${e.size ? " · " + e.size : ""}</span>` : "") +
      SVG_CHEV;
    row.onclick = () => e.type === "dir" ? navigate(rel(p, e.name)) : open(rel(p, e.name), e.name);
    g.appendChild(row);
  }
  updateNav();
  scrollTo(0, 0);
}

function navigate(p) {
  if (p === hist[hidx]) return;
  hist.push(p); hidx++;
  render(p);
}

const ta = document.getElementById("ta"), ln = document.getElementById("ln");
function renderLN() {
  ln.textContent = Array.from({ length: ta.value.split("\n").length }, (_, i) => i + 1).join("\n");
}
ta.addEventListener("input", renderLN);
ta.addEventListener("scroll", () => { ln.style.transform = `translateY(${-ta.scrollTop}px)`; });
ta.addEventListener("keydown", e => {                    // Ctrl+X 无选区：剪切整行
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "x") return;
  if (ta.selectionStart !== ta.selectionEnd) return;     // 有选区 → 交给浏览器原生剪切
  const v = ta.value, i = ta.selectionStart;
  const s = v.lastIndexOf("\n", i - 1) + 1;              // 行首
  const nl = v.indexOf("\n", i);
  const end = nl === -1 ? v.length : nl + 1;             // 整行含换行符
  const line = v.slice(s, end);
  e.preventDefault();
  ta.setSelectionRange(s, end);
  let ok = false;
  try { ok = document.execCommand("cut"); } catch (_) {}  // 原生剪切：写剪贴板 + 保留 undo 栈
  if (!ok) {                                             // 兜底：手动删行 + 写剪贴板
    ta.setRangeText("", s, end, "end");
    navigator.clipboard?.writeText(line).catch(() => {});
  }
  renderLN();
});

async function open(path, name) {
  const d = await api("/api/file?path=" + encodeURIComponent(path));
  if (!d || d.error) { if (d) toast(d.error || "打开失败"); return; }
  curFile = path;
  document.getElementById("filename").textContent = name;
  ta.value = d.content;
  savedVal = d.content;
  ta.scrollTop = 0; ln.style.transform = "translateY(0)"; renderLN();
  document.getElementById("editor").style.display = "flex";
}

function closeEd() { document.getElementById("editor").style.display = "none"; curFile = ""; }

async function save() {
  const d = await api("/api/file", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: curFile, content: ta.value })
  });
  if (d && d.ok) { savedVal = ta.value; okFlash(); }
  else fail("保存失败", d && d.error);
}

function refresh() {
  if (!curFile) return render(cur);
  if (ta.value !== savedVal && !confirm("有未保存的修改，刷新将丢弃它们，继续？")) return;
  open(curFile, document.getElementById("filename").textContent);
}
document.getElementById("refresh").onclick = refresh;

addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
    e.preventDefault();          // 拦掉浏览器的“保存网页”
    if (curFile) save();
  }
});

let tt;
function toast(m, keep) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(tt);
  if (!keep) tt = setTimeout(() => t.classList.remove("on"), 1600);
}

function okFlash() {
  const o = document.getElementById("okfl");
  o.classList.add("on");
  setTimeout(() => o.classList.remove("on"), 500);
}

function fail(title, msg, log) {
  document.getElementById("dlgtitle").textContent = title;
  document.getElementById("dlgmsg").textContent = msg || "未知错误";
  const lg = document.getElementById("dlglog");
  lg.textContent = (log || []).join("\n");
  lg.hidden = !lg.textContent;
  document.getElementById("dlg").hidden = document.getElementById("dlgmask").hidden = false;
}

function closeDlg() { document.getElementById("dlg").hidden = document.getElementById("dlgmask").hidden = true; }

document.getElementById("back").onclick = () => {
  if (hidx > 0) { hidx--; render(hist[hidx]); }
};

// ---- 加号菜单 ----
const fab = document.getElementById("fab"), fileinp = document.getElementById("fileinp");
const menu = document.getElementById("menu"), mask = document.getElementById("mask");
const showMenu = v => { menu.hidden = mask.hidden = !v; };
fab.onclick = () => showMenu(menu.hidden);
mask.onclick = () => showMenu(false);
document.getElementById("miUpload").onclick = () => { showMenu(false); fileinp.click(); };
document.getElementById("miSync").onclick = () => { showMenu(false); sync(); };

async function sync() {
  fab.disabled = true;
  toast("同步中…", true);      // 多仓库同步耗时，提示常驻到结果出来
  const d = await api("/api/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: cur })
  });
  fab.disabled = false;
  if (d && d.ok) { okFlash(); render(cur); }
  else if (d) fail("同步失败", d.error, d.log);
}

fileinp.onchange = async () => {
  const f = fileinp.files[0];
  if (!f) return;
  fab.disabled = true;
  toast("上传中…");
  const fd = new FormData();
  fd.append("path", cur);
  fd.append("file", f);
  const d = await api("/api/upload", { method: "POST", body: fd });
  fab.disabled = false;
  fileinp.value = "";
  if (d && d.ok) { toast("已上传 " + d.name); render(cur); }
  else if (d) toast(d.error || "上传失败");
};

render("");
</script>
</body>
</html>
